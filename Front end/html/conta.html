<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Minha Conta - Gráfica Holliday</title>
    <link rel="stylesheet" href="../css/conta.css">
</head>
<body>

<header>
    <h1>Gráfica Holliday</h1>
    <p>Painel do Cliente</p>
</header>

<main class="container">

    <section class="perfil-card">
        <div class="foto-perfil">
            <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="Perfil">
        </div>

        <div class="dados">
            <h2>Minha Conta</h2>

            <label>Nome</label>
            <input type="text" id="nome">   

            <label>Email</label>
            <input type="email" id="email">

            <label>Telefone</label>
            <input type="text" id="telefone">

            <label>Empresa</label>
            <input type="text" id="empresa">

            <div class="botoes">
                <button onclick="editar()">Editar</button>
                <button onclick="salvar()">Salvar</button>
                <button class="voltar" onclick="voltarInicio()">Voltar</button>
                <a href="CyberX Proinicio2.html">
                <button class="sair" >Sair</button>
            </a>
            </div>
        </div>
    </section>

    <section class="pedidos">
        <h2>Últimos Pedidos</h2>
        <ul id="listaPedidos"></ul>
    </section>

</main>

<script src="../javascript/conta_logado.js"></script>
</body>
</html>
