<header>
    <h1>Cadastro de Produtos</h1>
    <p>Gráfica HollyDay</p>
</header>

<div class="container">

    <div class="card">
        <h2>Novo Produto</h2>

        <input
            type="text"
            id="nomeProduto"
            placeholder="Digite o nome do produto"
        >

        <button id="btnCadastrar">
            Cadastrar Produto
        </button>
    </div>

    <div class="card">
        <h2>Pesquisar Produto</h2>

        <input
            type="text"
            id="pesquisa"
            placeholder="Pesquisar produto..."
        >
    </div>

    <div id="listaProdutos" class="produtos"></div>

</div>
