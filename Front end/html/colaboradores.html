<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colaboradores - Gráfica HolliDay</title>
<link rel="stylesheet" href="../css/informaçõesdoscolaboradores.css">
</head>
<body>

<header>
    <form id="cadastroFuncionario">
    <h1>Colaboradores - Gráfica HolliDay</h1>
    <button class="btn-voltar" onclick="voltarPagina()">
    Voltar
</button>   

    <button id="btnCadastrar" class="btn-cadastrar">
        Cadastrar Funcionário
    </button>

    <input type="text" id="barraPesquisa" placeholder="🔎 Pesquisar por nome..." class="barra-pesquisa">
    
</header>

<section id="formContainer" class="form-container oculto">
    <h2 id="tituloForm">Novo Funcionário</h2>

    
    <label for="nome"></label>
    <input type="text" id="nome" placeholder="Nome completo">

    <label for="nome"></label>
    <input type="text" id="cargo" placeholder="Cargo">

    <label for="email"></label>
    <input type="email" id="email" placeholder="Email">

    <label for="senha"></label>
    <input type="password" id="senha" placeholder="Senha">

    <label for="cpf"></label>
    <input type="text" id="cpf" placeholder="Cpf">

    <label for="telefone"></label>
    <input type="tel" id="telefone" placeholder="Telefone">

    <label for="datanasc"></label>
    <input type="date" id="datanasc" placeholder="Telefone">

 <!--<input type="file" id="foto"  value="Anexar imagem" accept="image/*"> -->
    

<!-- <img id="previewFoto" class="preview-img"> -->

    <button type="submit" id="salvar" class="salvar">
        Salvar
    </button>
</section>

<section class="funcoes-container" id="funcoesContainer"></section>
<section class="funcionarios-container" id="funcionariosContainer"></section>
</form>
<script src="../javascript/colaboradores.js"></script>
<script>
function voltarPagina() {
    window.history.back();
}
</script>
</body>
</html>
