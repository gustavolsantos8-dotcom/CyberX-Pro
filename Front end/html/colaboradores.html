<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colaboradores - Gráfica HolliDay</title>
    <link rel="stylesheet" href="../css/informaçõesdoscolaboradores.css">
</head>
<body>

<header>
    <h1>Colaboradores - Gráfica HolliDay</h1>
    <button class="btn-voltar" onclick="voltarPagina()">Voltar</button>
    <button id="btnCadastrar" class="btn-cadastrar">Cadastrar Funcionário</button>
    <input type="text" id="barraPesquisa" placeholder="🔎 Pesquisar por nome..." class="barra-pesquisa">
</header>

<!-- Formulário fora do <form id="cadastroFuncionario"> para não conflitar -->
<section id="formContainer" class="form-container oculto">
    <h2 id="tituloForm">Novo Funcionário</h2>
    <form id="cadastroFuncionario">
        <input type="text"     id="nome"     placeholder="Nome completo">
        <input type="text"     id="cargo"    placeholder="Cargo">
        <input type="email"    id="email"    placeholder="Email">
        <input type="password" id="senha"    placeholder="Senha">
        <input type="text"     id="cpf"      placeholder="CPF">
        <input type="tel"      id="telefone" placeholder="Telefone">
        <input type="date"     id="datanasc" placeholder="Data de Nascimento">
        <button type="submit" id="salvar" class="salvar">Salvar</button>
    </form>
</section>

<!-- Tabela de funcionários renderizada pelo JS -->
<section class="funcionarios-container" id="funcionariosContainer"></section>

<script src="../javascript/colaboradores.js"></script>
<script>
    function voltarPagina() {
        window.history.back();
    }
</script>
</body>
</html>
