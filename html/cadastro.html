<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/cadastro.css">
</head>
<body>
    <div class="container">
        <h1>Gráfica Holliday</h1>
        <p class="subtitulo">Cadastre-se com segurança</p>

        <form id="formulario">
            <label>Nome completo</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label>Email</label>
            <input type="email" id="email" placeholder="Digite seu email" required>

            <label>Telefone</label>
            <input type="tel" id="telefone" placeholder="(00) 00000-0000"required>

            <label>Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" minlength="8" required>

            <label> Repita a Senha</label>
            <input type="password" id="senha2" placeholder="Digite sua senha" minlength="8" required>

            <input type="submit" class="cadastro"  value="Cadastrar">
        
            <a href="cli_login.html" class="voltar">Voltar</a>
        </form>

        <p id="mensagem"></p>
    </div>

    <script src="/javascript/cadastro.js"></script>
</body>
</html>
