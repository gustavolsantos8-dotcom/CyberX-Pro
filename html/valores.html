<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orçamento | Gráfica HolliDay</title>
<link rel="stylesheet" href="../css/valores.css">
</head>

<body>

<header class="header">
    <h1>Gráfica HolliDay</h1>
    <p>Orçamento Online Profissional</p>
</header>

<main class="container">

    <section>
        <h2>1. Escolha o Produto</h2>
        <div class="grid" id="produtos"></div>
    </section>

    <section>
        <h2>2. Escolha o Tamanho / Modelo</h2>
        <div class="grid" id="tamanhos"></div>
    </section>

    <section>
        <h2>3. Escolha a Cor</h2>
        <div class="grid" id="cores"></div>
    </section>

    <section class="quantidade-section">
        <h2>4. Quantidade</h2>
        <input type="number" id="quantidade" min="0" value="0">
    </section>

    
    <section class="resultado-box" > 
        <p>Total do Pedido</p>
        <h3 id="total">R$ 0,00</h3>
        
        <button  id="btnPedido" class="btn-principal" >
            Finalizar Pedido
        </button>
        
    </section>
    

    <section id="areaPersonalizacao" class="personalizacao">
        <h2>Personalização</h2>
        <textarea id="descricaoPersonalizacao"
        placeholder="Descreva como deseja seu produto personalizado..."></textarea>

        <input type="file" id="imagemReferencia" accept="image/*">

        <button id="btnEnviarPersonalizacao" class="btn-secundario">
            Enviar Personalização
        </button>

        <div id="mensagemSucesso"></div>
    </section>

</main>

<script src="../javascript/valores.js"></script>
</body>
</html>
