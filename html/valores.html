<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Orçamento</title>
<link rel="stylesheet" href="/css/valores.css">
</head>

<body>

<div class="container">

<h2>Orçamento</h2>

<div class="botoes-orcamento">
    <button class="voltar" onclick="voltarInicio()">Voltar</button>
</div>

<h3>Escolha o Produto</h3>
<div class="grid" id="Produtos"></div>

<h3>Escolha o Tamanho</h3>
<div class="grid" id="Tamanhos"></div>

<h3>Escolha a Cor</h3>
<div class="grid" id="Cores"></div>

<h3>Quantidade</h3>
<input type="number" id="Quantidade" value="1" min="1">

<div class="resultado">
Total: <strong id="Total">R$ 0,00</strong>
</div>
<button id="btnEnviarPedido" class="btn-enviar-pedido" onclick="enviarPedido()">
    Enviar Pedido
</button>
<div id="areaPersonalizacao" class="area-personalizacao">

    <p>
        Descreva abaixo como deseja personalizar seu produto.
        Você também pode enviar uma imagem de referência.
    </p>

    <textarea id="descricaoPersonalizacao"
    placeholder="Digite aqui como você deseja seu produto personalizado..."></textarea>

    <div class="upload-imagem">
        <label>Enviar imagem de referência:</label>
        <input type="file" id="imagemReferencia" accept="image/*">
    </div>

    <button class="btn-enviar-personalizacao" onclick="enviarPersonalizacao()">
        Enviar Personalização
    </button>

    <div id="mensagemSucesso" class="mensagem-sucesso"></div>

</div>

</div>

<script src="/javascript/valores.js"></script>
</body>
</html>
