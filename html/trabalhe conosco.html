<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/trabalhe.css">
</head>

<body>
    <form>

<a href="../html/CyberX Proinicio2.html" class="voltar">
    ← Voltar
</a>
    

                <h1 id="titulos">Trabalhe Conosco</h1>
        <label>Nome completo</label>
        <input type="text" id="nome" placeholder="Digite seu nome" required>

        <label>Telefone para Contato</label>
        <input type="tel" id="telefone" placeholder="Ex: (79) 98113-9212" required>

        <label>E-mail para Contato</label>
        <input type="email" id="email" placeholder="Digite seu E-mail" required>

        

        <div class="caixa_Endereço">

            <h3 id="titulos">Endereço</h3>
        
            <div class="campos_Endereço">
        
                <div class="campo cep">
                    <label>CEP</label>
                    <input type="text" id="cep" placeholder="Digite o CEP" required>
                </div>
        
                <div class="campo rua">
                    <label>Rua</label>
                    <input type="text" id="rua" required>
                </div>
        
                <div class="campo bairro">
                    <label>Bairro</label>
                    <input type="text" id="bairro" required>
                </div>
        
                <div class="campo cidade">
                    <label>Cidade</label>
                    <input type="text" id="cidade" required>
                </div>
        
                <div class="campo estado">
                    <label>Estado</label>
                    <input type="text" id="estado" required>
                </div>
        
                <div class="campo numero">
                    <label>Número</label>
                    <input type="text" id="numero" required>
                </div>
        
                <div class="campo complemento">
                    <label>Complemento</label>
                    <input type="text" id="complemento" required>
                </div>
        
            </div>
        </div>
        

        <label for="Interesse">Área de Interesse</label>
        <select id="Interesse" name="Interesse" required>
            <option value="Impressor Offset">Impressor Offset</option>
            <option value="Cortador">Cortador</option>
            <option value="Brochurista">Brochurista</option>
            <option value="Operador de Corte e Vinco">Operador de Corte e Vinco</option>
            <option value="Analista de PCP">Analista de PCP</option>
            <option value="Arte Finalista">Arte Finalista</option>
            <option value="Supervisor de Arte Finalista">Supervisor de Arte Finalista</option>
            <option value="Auxiliar Financeiro">Auxiliar Financeiro</option>
            <option value="Supervisor Financeiro">Supervisor Financeiro</option>
            <option value="Supervisor Comercial">Supervisor Comercial</option>
            <option value="Consultor de Vendas">Consultor de Vendas</option>
            <option value="Atendente">Atendente</option>
            <option value="Orçamentista">Orçamentista</option>
            <option value="Motoboy">Motoboy</option>
            <option value="Faxineira">Faxineira</option>

        </select>

        <div class="campo-mensagem">
            <label>Mensagem</label>
            <textarea placeholder="Escreva sua mensagem aqui..."></textarea>
        </div>

        <label>Salário Pretendido</label>
        <input type="number" id="Salário" placeholder="Digite o Salário Pretendido" min="0" required>

       
      <div class="upload-box">
    <label for="arquivo" class="upload-label">
        📎 Enviar Currículo
    </label>

    <input type="file" id="arquivo" accept=".doc,.docx,.pdf,.jpg" required>

    <span id="nomeArquivo">Nenhum arquivo selecionado</span>

    <small>Formatos permitidos: doc, docx, pdf, jpg (Máx: 5MB)</small>
</div>
        <input type="submit">
    </form>
    <script src="/javascript/trabalhe.js"></script>
</body>

</html>
