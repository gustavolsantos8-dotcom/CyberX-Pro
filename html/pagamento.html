<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pagamento - Gráfica Holliday</title>
<link rel="stylesheet" href="/css/pagamento.css">
</head>
<body>

<div class="container">

<h2>Finalizar Pagamento</h2>

<div class="resumo">
    <h3>Resumo do Pedido</h3>
    <p><strong>Produto:</strong> <span id="resProduto"></span></p>
    <p><strong>Tamanho:</strong> <span id="resTamanho"></span></p>
    <p><strong>Cor:</strong> <span id="resCor"></span></p>
    <p><strong>Quantidade:</strong> <span id="resQuantidade"></span></p>
    <p class="total"><strong>Total:</strong> <span id="resTotal"></span></p>
</div>

<h3>Forma de Pagamento</h3>

<select id="formaPagamento">
    <option value="Pix">Pix</option>
    <option value="Cartão">Cartão</option>
    <option value="Boleto">Boleto</option>
</select>

<button class="btn-pagar" onclick="finalizarPagamento()">
    Confirmar Pagamento
</button>

<div id="mensagemFinal" class="mensagem-final"></div>

</div>

<script src="/javascript/pagamento.js"></script>
</body>
</html>
